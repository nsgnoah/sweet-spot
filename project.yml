name: Overlap
options:
  bundleIdPrefix: co.nsgsolutions
  deploymentTarget:
    iOS: "17.0"
targets:
  Overlap:
    type: application
    platform: iOS
    sources: [Overlap]
    scheme:
      testTargets: [OverlapUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.nsgsolutions.overlap
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Sweet Spot"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S6QW7SV228
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.word-games
  OverlapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OverlapUITests]
    dependencies:
      - target: Overlap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Overlap
        DEVELOPMENT_TEAM: S6QW7SV228
        PRODUCT_BUNDLE_IDENTIFIER: co.nsgsolutions.overlap.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
